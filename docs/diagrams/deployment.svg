<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="depTitle depDesc">
<title id="depTitle">What ran and what did not</title>
<desc id="depDesc">This workstation ran Python 3.12.10, an in-memory graph, SQLite, OR-Tools, pytest, and the demo. Docker, Neo4j, Kafka, PostgreSQL, Grafana, and a controller did not run. GitHub Actions is the image and live-adapter proof and is not drawn as already green. No timings are shown.</desc>
